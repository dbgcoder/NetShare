<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NetShare - 发送文件</title></head><body style='font-family:system-ui,-apple-system,sans-serif;background:#0f0f23;color:#eee;margin:0;padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center'><div style='max-width:540px;width:100%;padding:20px'><div style='background:#16213e;border-radius:16px;padding:40px;text-align:center'><div style='font-size:48px;margin-bottom:16px'>📤</div><h1 style='font-size:24px;margin:0 0 8px'>发送文件</h1><p style='color:#888;margin:0 0 24px'>选择文件发送到对方设备</p><input type='file' multiple style='position:absolute;opacity:0;width:0;height:0;overflow:hidden' id='fileInput'><input type='file' multiple webkitdirectory directory mozdirectory style='position:absolute;opacity:0;width:0;height:0;overflow:hidden' id='folderInput'><div id='dropZone' style='border:2px dashed #2a2a3e;border-radius:12px;padding:40px;cursor:pointer;transition:border-color 0.2s'><div style='font-size:48px;margin-bottom:12px'>📁</div><p style='color:#888;font-size:14px'>将文件拖拽到此处或 <span style='color:#4caf50;font-weight:600'>点击选择文件</span></p></div><div style='display:flex;gap:8px;margin-top:12px'><div onclick='_dbg("[ReceivePage] btn:select file");document.getElementById("fileInput").click()' style='flex:1;padding:10px;background:#1a1a3e;color:#4caf50;border:1px solid #2a2a3e;border-radius:8px;font-size:14px;cursor:pointer;text-align:center'>📄 选择文件</div><div onclick='_dbg("[ReceivePage] btn:select folder");document.getElementById("folderInput").click()' style='flex:1;padding:10px;background:#1a1a3e;color:#2196f3;border:1px solid #2a2a3e;border-radius:8px;font-size:14px;cursor:pointer;text-align:center'>📁 选择文件夹</div></div><div id='fileList' style='margin:16px 0;max-height:200px;overflow-y:auto'></div><div id='resumeHint' style='display:none;background:rgba(33,150,243,0.1);border:1px solid rgba(33,150,243,0.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#64b5f6'></div><div id='progress' style='display:none;margin:16px 0'><div style='height:6px;background:#2a2a3e;border-radius:3px;overflow:hidden'><div id='progressBar' style='height:100%;background:#4caf50;width:0%;transition:width 0.3s'></div></div><div style='display:flex;justify-content:space-between;margin-top:8px'><span id='progressPct' style='color:#888;font-size:12px'>0%</span><span id='statusText' style='color:#888;font-size:12px'>发送中...</span></div></div><button type='button' id='uploadBtn' disabled style='width:100%;padding:14px;background:#4caf50;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer'>开始发送</button><button type='button' id='retryBtn' onclick='retryFailed()' style='display:none;width:100%;padding:12px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px'>重试失败文件</button><div id='result' style='display:none;margin-top:20px'><div style='font-size:48px;margin-bottom:12px'>✅</div><p id='resultText' style='color:#888;font-size:14px'>文件发送成功！</p></div></div><p style='color:#444;font-size:12px;text-align:center;margin-top:16px'>由 NetShare 提供</p></div><script>function _dbg(msg){console.log(msg);try{fetch('/api/debug',{method:'POST',body:msg})}catch(e){}}_dbg('[ReceivePage] SCRIPT LOADED');let files=[];let uploadStatus={};let uploadedSize=0;let totalUploadSize=0;let failedFiles=[];let uploadSessionId='';let chunkInfo={};let xhrProgressActive=false;let ws=null;let wsConnected=false;const MAX_CONCURRENT=3;const fi=document.getElementById('fileInput'),foi=document.getElementById('folderInput'),dz=document.getElementById('dropZone'),fl=document.getElementById('fileList'),ub=document.getElementById('uploadBtn'),rb=document.getElementById('retryBtn'),rh=document.getElementById('resumeHint');_dbg('[ReceivePage] fi='+fi+' foi='+foi+' dz='+dz+' fl='+fl+' ub='+ub);fi.addEventListener('change',function(){_dbg('[ReceivePage] fi.change fired, count='+fi.files.length);addFiles(fi.files);fi.value=''});foi.addEventListener('change',function(){_dbg('[ReceivePage] foi.change fired, count='+foi.files.length);addFiles(foi.files);foi.value=''});function addFiles(fileList){_dbg('[ReceivePage] addFiles called, count='+fileList.length);Array.from(fileList).forEach(f=>files.push({file:f,path:f.webkitRelativePath||f.name}));renderList();ub.disabled=!files.length;_dbg('[ReceivePage] addFiles done, total='+files.length)}dz.onclick=function(){_dbg('[ReceivePage] dz.onclick, calling fi.click()');fi.click()};dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='#4caf50'};dz.ondragleave=()=>dz.style.borderColor='#2a2a3e';dz.ondrop=async e=>{e.preventDefault();dz.style.borderColor='#2a2a3e';var items=e.dataTransfer.items;if(items&&items.length>0){var entries=[];for(var i=0;i<items.length;i++){var en=items[i].webkitGetAsEntry?items[i].webkitGetAsEntry():null;if(en)entries.push(en)}if(entries.length>0){var r=await traverseEntries(entries,'');r.forEach(x=>{files.push(x)});renderList();ub.disabled=!files.length;return}}addFiles(e.dataTransfer.files)};function formatSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(1)+' GB'}function connectWS(){if(ws&&(ws.readyState===1||ws.readyState===0))return;var wsPort=location.port?parseInt(location.port)+1:8081;try{ws=new WebSocket('ws://'+location.hostname+':'+wsPort)}catch(e){return}ws.onopen=function(){wsConnected=true;if(uploadSessionId)ws.send(JSON.stringify({type:'subscribe',data:{token:uploadSessionId}}))};ws.onmessage=function(e){try{var m=JSON.parse(e.data);if(m.type==='transfer_update'&&m.data&&m.data.progress!==undefined&&!xhrProgressActive){var pb=document.getElementById('progressBar');if(pb)pb.style.width=m.data.progress+'%';var pp=document.getElementById('progressPct');if(pp)pp.textContent=m.data.progress+'%';if(m.data.speed){var st=document.getElementById('statusText');if(st)st.textContent=formatSize(m.data.speed)+'/s'}}}catch(ex){}};ws.onclose=function(){wsConnected=false;var hasActive=Object.values(uploadStatus).some(function(s){return s==='uploading'||s==='pending'});if(hasActive)setTimeout(connectWS,5000)};ws.onerror=function(){}}function traverseEntries(entries,basePath){return new Promise(function(resolve){var results=[],pending=entries.length;if(pending===0){resolve(results);return}for(var i=0;i<entries.length;i++){var entry=entries[i];if(entry.isFile){entry.file(function(f){results.push({file:f,path:basePath?basePath+'/'+f.name:f.name});if(--pending===0)resolve(results)},function(){if(--pending===0)resolve(results)})}else if(entry.isDirectory){readAllDir(entry,basePath).then(function(sub){results=results.concat(sub);if(--pending===0)resolve(results)})}else{if(--pending===0)resolve(results)}}})}function readAllDir(dirEntry,parentPath){var dirPath=parentPath?parentPath+'/'+dirEntry.name:dirEntry.name;var reader=dirEntry.createReader();return new Promise(function(resolve){var all=[];function readBatch(){reader.readEntries(function(batch){if(batch.length===0){if(all.length===0){resolve([]);return}traverseEntries(all,dirPath).then(resolve)}else{all=all.concat(batch);readBatch()}},function(){resolve([])})}readBatch()})}function renderList(){_dbg('[ReceivePage] renderList, count='+files.length);fl.innerHTML='';let totalSize=0;files.forEach(function(item,i){totalSize+=item.file.size;fl.innerHTML+='<div style="padding:8px 12px;background:#0f0f23;border-radius:6px;margin:4px 0;display:flex;justify-content:space-between;align-items:center"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">📄 '+item.path+'</span><span style="color:#888;font-size:11px;flex-shrink:0;margin:0 8px">'+formatSize(item.file.size)+'</span><button onclick="removeFile('+i+')" style="background:#e94560;color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;flex-shrink:0">×</button></div>'});if(files.length>0){fl.innerHTML+='<div style="text-align:right;padding:4px 12px;color:#888;font-size:12px">共 '+files.length+' 个文件，总大小 '+formatSize(totalSize)+'</div>'}}function removeFile(i){files.splice(i,1);renderList();ub.disabled=!files.length}ub.onclick=async function(){_dbg('[ReceivePage] ub.onclick, files='+files.length);if(!files.length)return;totalUploadSize=0;files.forEach(x=>totalUploadSize+=x.file.size);uploadedSize=0;failedFiles=[];uploadStatus={};uploadSessionId='';chunkInfo={};xhrProgressActive=false;files.forEach(x=>uploadStatus[x.path]='pending');document.getElementById('progress').style.display='block';ub.disabled=true;rb.style.display='none';rh.style.display='none';updateProgress(0,files.length,0,totalUploadSize);var toUpload=[].concat(files);try{var checkResp=await fetch('/api/upload/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:files.map(x=>({path:x.path,size:x.file.size}))})});if(checkResp.ok){var cd=await checkResp.json();if(cd.sessionId){uploadSessionId=cd.sessionId;connectWS()}var skipCount=0;var resumeCount=0;if(cd.existing&&cd.existing.length>0){var ep=new Set(cd.existing.map(f=>f.path));var ss=files.filter(x=>ep.has(x.path)).reduce((s,x)=>s+x.file.size,0);ep.forEach(p=>uploadStatus[p]='done');uploadedSize+=ss;toUpload=files.filter(x=>!ep.has(x.path));skipCount=ep.size}if(cd.partial&&cd.partial.length>0){cd.partial.forEach(function(f){if(f.useChunking!==false&&f.chunkSize&&f.chunkCount){chunkInfo[f.path]={chunkSize:f.chunkSize,chunkCount:f.chunkCount,completedChunks:new Set(f.completedChunks||[]),useChunking:true};uploadedSize+=(f.completedChunks||[]).length*f.chunkSize}else{chunkInfo[f.path]={resumeOffset:f.size,useChunking:false};uploadedSize+=f.size}});resumeCount=cd.partial.length}if(skipCount>0||resumeCount>0){var hint='检测到未完成的上传，';var parts=[];if(skipCount>0)parts.push('跳过'+skipCount+'个已完成文件');if(resumeCount>0)parts.push('续传'+resumeCount+'个部分文件');rh.textContent=hint+parts.join('，');rh.style.display='block'}}}catch(ex){}await uploadConcurrent(toUpload);var fc=Object.values(uploadStatus).filter(s=>s==='failed').length;var dc=Object.values(uploadStatus).filter(s=>s==='done').length;if(fc>0){document.getElementById('statusText').textContent=fc+' 个文件发送失败';rb.style.display='block'}else if(dc===files.length){await finalize()}};async function uploadConcurrent(fileList){if(!fileList.length)return;var idx=0;var total=files.length;async function next(){while(idx<fileList.length){var item=fileList[idx++];uploadStatus[item.path]='uploading';try{await uploadOne(item);uploadStatus[item.path]='done'}catch(e){uploadStatus[item.path]='failed';failedFiles.push(item)}var dc=Object.values(uploadStatus).filter(s=>s==='done').length;updateProgress(dc,total,uploadedSize,totalUploadSize)}}var workers=[];var cc=Math.min(MAX_CONCURRENT,fileList.length);for(var i=0;i<cc;i++)workers.push(next());await Promise.all(workers)}function uploadOne(item){var info=chunkInfo[item.path];if(info&&info.useChunking)return uploadChunked(item,info);return uploadSmall(item,info)}function uploadChunked(item,info){var fileSize=item.file.size,chunkSize=info.chunkSize,totalChunks=Math.ceil(fileSize/chunkSize);var pending=[];for(var i=0;i<totalChunks;i++){if(!info.completedChunks.has(i))pending.push(i)}if(pending.length===0)return Promise.resolve();var nextCI=0;function uploadNextChunk(){return new Promise(function(resolveAll){var promises=[];var cc=Math.min(MAX_CONCURRENT,pending.length);for(var w=0;w<cc;w++){promises.push(new Promise(function(resolveW){function doNext(){if(nextCI>=pending.length){resolveW();return}var ci=pending[nextCI++];var start=ci*chunkSize;var end=Math.min(start+chunkSize,fileSize);var blob=item.file.slice(start,end);var xhr=new XMLHttpRequest();xhr.open('POST','/api/upload/file',true);xhr.setRequestHeader('X-Upload-Session',uploadSessionId);xhr.setRequestHeader('X-File-Path',item.path);xhr.setRequestHeader('X-Chunk-Index',ci.toString());xhr.upload.onprogress=function(e){if(e.lengthComputable){xhrProgressActive=true;var cb=info.completedChunks.size*chunkSize+e.loaded;var pct=Math.min(100,Math.round(cb/fileSize*100));var pb=document.getElementById('progressBar');if(pb)pb.style.width=pct+'%';var st=document.getElementById('statusText');if(st)st.textContent=formatSize(cb)+' / '+formatSize(fileSize)}};xhr.onload=function(){if(xhr.status===200){info.completedChunks.add(ci);uploadedSize+=blob.size;resolveW();doNext()}else{resolveW()}};xhr.onerror=function(){resolveW()};xhr.timeout=0;xhr.send(blob)}doNext()}))}Promise.all(promises).then(resolveAll)})return uploadNextChunk()}}function uploadSmall(item,info){return new Promise(function(resolve,reject){var offset=(info&&info.resumeOffset)?info.resumeOffset:0;var blob=offset>0?item.file.slice(offset):item.file;var fd=new FormData();fd.append('file',blob,item.path);var xhr=new XMLHttpRequest();xhr.open('POST','/api/upload/file',true);if(uploadSessionId)xhr.setRequestHeader('X-Upload-Session',uploadSessionId);xhr.setRequestHeader('X-File-Path',item.path);xhr.upload.onprogress=function(e){if(e.lengthComputable){xhrProgressActive=true;var totalLoaded=offset+e.loaded;var pct=Math.round(totalLoaded/item.file.size*100);var pb=document.getElementById('progressBar');var st=document.getElementById('statusText');if(pb)pb.style.width=pct+'%';if(st)st.textContent=formatSize(totalLoaded)+' / '+formatSize(item.file.size)}};xhr.timeout=0;xhr.onload=function(){if(xhr.status===200){uploadedSize+=item.file.size-offset;resolve()}else{reject(new Error(''+xhr.status))}};xhr.onerror=function(){reject(new Error('network'))};xhr.ontimeout=function(){reject(new Error('timeout'))};xhr.send(fd)})}function updateProgress(done,total,doneSz,totalSz){var pct=totalSz>0?Math.round(doneSz/totalSz*100):(total>0?Math.round(done/total*100):0);document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressPct').textContent=pct+'% ('+done+'/'+total+')';document.getElementById('statusText').textContent='发送中... '+formatSize(doneSz)+' / '+formatSize(totalSz)}async function retryFailed(){if(!failedFiles.length)return;rb.style.display='none';var retry=[].concat(failedFiles);failedFiles=[];chunkInfo={};xhrProgressActive=false;try{var cr=await fetch('/api/upload/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:retry.map(x=>({path:x.path,size:x.file.size}))})});if(cr.ok){var cd=await cr.json();if(cd.sessionId){uploadSessionId=cd.sessionId;connectWS()}if(cd.existing&&cd.existing.length>0){var ep=new Set(cd.existing.map(f=>f.path));retry=retry.filter(x=>!ep.has(x.path));ep.forEach(p=>uploadStatus[p]='done')}if(cd.partial&&cd.partial.length>0){cd.partial.forEach(function(f){if(f.useChunking!==false&&f.chunkSize&&f.chunkCount){chunkInfo[f.path]={chunkSize:f.chunkSize,chunkCount:f.chunkCount,completedChunks:new Set(f.completedChunks||[]),useChunking:true}}else{chunkInfo[f.path]={resumeOffset:f.size,useChunking:false}}})}}}catch(ex){}retry.forEach(x=>uploadStatus[x.path]='pending');await uploadConcurrent(retry);var fc=Object.values(uploadStatus).filter(s=>s==='failed').length;var dc=Object.values(uploadStatus).filter(s=>s==='done').length;if(fc>0){document.getElementById('statusText').textContent=fc+' 个文件发送失败';rb.style.display='block'}else if(dc===files.length){await finalize()}}async function finalize(){document.getElementById('statusText').textContent='正在完成...';var fp=files[0].path;var isFolder=fp.indexOf('/')>=0;var fr=isFolder?fp.split('/')[0]:'';try{var resp=await fetch('/api/upload/finalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:fr,isFolder:isFolder,totalSize:totalUploadSize,fileCount:files.length,token:'',isReceive:true,sessionId:uploadSessionId})});if(resp.ok){var d=await resp.json();ub.style.display='none';document.getElementById('progress').style.display='none';rb.style.display='none';document.getElementById('resultText').textContent='成功发送 '+d.count+' 个文件！';document.getElementById('result').style.display='block'}else{document.getElementById('statusText').textContent='完成操作失败';ub.disabled=false}}catch(e){document.getElementById('statusText').textContent='完成操作失败';ub.disabled=false}}</script></body></html>
