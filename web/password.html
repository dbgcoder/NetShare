<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShare</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f23; color: #eee;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container { max-width: 400px; width: 100%; padding: 20px; }
        .card {
            background: #16213e; border-radius: 16px; padding: 40px; text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        .desc { color: #888; margin: 0 0 24px; }
        .pw-form { display: flex; gap: 8px; }
        .pw-form input {
            flex: 1; padding: 12px 16px; border: 1px solid #2a2a3e; border-radius: 8px;
            background: #1a1a2e; color: #eee; font-size: 14px; outline: none;
        }
        .pw-form input:focus { border-color: #e94560; }
        .pw-form button {
            padding: 12px 24px; background: #e94560; color: #fff; border: none;
            border-radius: 8px; font-size: 14px; cursor: pointer;
        }
        .pw-form button:hover { background: #ff6b81; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">🔒</div>
            <h1 data-i18n="pwd_title">密码验证</h1>
            <p class="desc" data-i18n="enter_pwd">此分享需要密码才能访问</p>
            <form class="pw-form" method="get" action="/s/{{TOKEN}}">
                <input type="password" name="pw" data-i18n-placeholder="pwd_placeholder" placeholder="请输入密码">
                <button type="submit" data-i18n="verify">验证</button>
            </form>
        </div>
    </div>
    <script src="common.js"></script>
    <script>applyI18n();</script>
</body>
</html>
