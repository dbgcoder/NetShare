<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShare - 文件分享</title>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-card: #16213e;
            --bg-hover: #1a1a2e;
            --accent: #e94560;
            --accent-hover: #ff6b81;
            --text-primary: #eee;
            --text-secondary: #888;
            --text-muted: #555;
            --border: #2a2a3e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 640px;
            width: 100%;
        }
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 24px;
            font-size: 13px;
        }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            background: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
        }
        .file-table th {
            padding: 12px 16px;
            text-align: left;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .file-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .file-table tr:last-child td { border-bottom: none; }
        .file-table tr:hover td { background: var(--bg-hover); }
        .file-table a {
            color: var(--accent);
            text-decoration: none;
        }
        .file-table a:hover { text-decoration: underline; }
        .file-size { color: var(--text-secondary); font-size: 13px; }

        .progress-wrap {
            margin-top: 20px;
            display: none;
        }
        .progress-wrap.active { display: block; }
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .password-form {
            margin-top: 20px;
            display: flex;
            gap: 8px;
        }
        .password-form input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .password-form input:focus { border-color: var(--accent); }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
            justify-content: center;
        }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb .sep { color: var(--text-muted); }

        .footer { color: var(--text-muted); font-size: 12px; margin-top: 24px; }

        .ws-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .ws-status.connected { background: #4caf50; }
        .ws-status.disconnected { background: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <div class="icon" id="shareIcon">📂</div>
            <h1 id="shareName">加载中...</h1>
            <p class="subtitle" id="shareSubtitle">正在获取分享信息</p>

            <div id="downloadBtns"></div>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-info">
                    <span id="progressText">0%</span>
                    <span id="speedText">-- KB/s</span>
                </div>
            </div>

            <div id="passwordSection" style="display:none">
                <div class="password-form">
                    <input type="password" id="pwInput" placeholder="输入访问密码">
                    <button class="btn" onclick="submitPassword()">验证</button>
                </div>
            </div>

            <div id="fileListSection" style="display:none">
                <div class="breadcrumb" id="breadcrumb"></div>
                <table class="file-table">
                    <thead><tr>
                        <th>名称</th>
                        <th>大小</th>
                        <th>操作</th>
                    </tr></thead>
                    <tbody id="fileListBody"></tbody>
                </table>
            </div>

            <p class="footer">
                <span class="ws-status disconnected" id="wsStatus"></span>
                由 NetShare 提供
            </p>
        </div>
    </div>

<script>
const token = location.pathname.replace('/s/', '').split('?')[0];
let shareInfo = null;
let currentSub = '';
let ws = null;
let pw = '';

function formatSize(bytes) {
    if (!bytes || bytes === 0) return '--';
    const k = 1024;
    const s = ['B','KB','MB','GB','TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + s[i];
}

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

async function loadShare() {
    try {
        const url = pw ? '/s/' + token + '?pw=' + encodeURIComponent(pw) : '/s/' + token;
        const res = await fetch(url);
        if (res.redirected) {
            location.href = res.url;
            return;
        }
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const h1 = doc.querySelector('h1');
        if (h1) {
            document.getElementById('shareName').textContent = h1.textContent;
            document.getElementById('shareSubtitle').textContent = '文件夹分享';
            document.getElementById('shareIcon').textContent = '📂';
        }
        const downloadLink = doc.querySelector('a[href*="/download/"]');
        if (downloadLink) {
            document.getElementById('shareName').textContent = h1 ? h1.textContent : '文件分享';
            document.getElementById('shareSubtitle').textContent = '文件分享';
            document.getElementById('shareIcon').textContent = '📄';
        }
        const folderLink = doc.querySelector('a[href*="/folder/"]');
        const tableRows = doc.querySelectorAll('table tr');

        let btns = '';
        if (folderLink) {
            btns += '<a class="btn" href="/folder/' + token + '" style="margin-right:8px">打包下载 (ZIP)</a>';
        }
        if (downloadLink) {
            btns += '<a class="btn" href="/download/' + token + '/">下载文件</a>';
        }
        document.getElementById('downloadBtns').innerHTML = btns;

        if (tableRows.length > 1) {
            document.getElementById('fileListSection').style.display = 'block';
            const tbody = document.getElementById('fileListBody');
            tbody.innerHTML = '';
            for (let i = 1; i < tableRows.length; i++) {
                const cells = tableRows[i].querySelectorAll('td');
                if (cells.length >= 3) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + cells[0].innerHTML + '</td>' +
                                   '<td class="file-size">' + cells[1].textContent + '</td>' +
                                   '<td>' + cells[2].innerHTML + '</td>';
                    tbody.appendChild(tr);
                }
            }
        }

        document.getElementById('passwordSection').style.display = 'none';
        document.getElementById('downloadBtns').style.display = 'block';

    } catch (e) {
        document.getElementById('shareName').textContent = '加载失败';
        document.getElementById('shareSubtitle').textContent = e.message;
    }
}

function submitPassword() {
    pw = document.getElementById('pwInput').value;
    if (!pw) return;
    loadShare();
}

function connectWebSocket() {
    const wsPort = location.port ? parseInt(location.port) + 1 : 8081;
    const wsUrl = 'ws://' + location.hostname + ':' + wsPort;
    try {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
            document.getElementById('wsStatus').className = 'ws-status connected';
            ws.send(JSON.stringify({ type: 'subscribe', data: { token: token } }));
        };
        ws.onclose = () => {
            document.getElementById('wsStatus').className = 'ws-status disconnected';
            setTimeout(connectWebSocket, 5000);
        };
        ws.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'transfer_update') {
                    handleTransferUpdate(msg.data);
                }
            } catch (err) {}
        };
    } catch (e) {
        document.getElementById('wsStatus').className = 'ws-status disconnected';
    }
}

function handleTransferUpdate(data) {
    if (data.progress !== undefined) {
        document.getElementById('progressWrap').classList.add('active');
        document.getElementById('progressFill').style.width = data.progress + '%';
        document.getElementById('progressText').textContent = data.progress + '%';
        if (data.speed) {
            document.getElementById('speedText').textContent = formatSize(data.speed) + '/s';
        }
    }
}

loadShare();
connectWebSocket();
</script>
</body>
</html>
