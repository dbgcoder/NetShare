<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShare - 上传文件</title>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-card: #16213e;
            --bg-hover: #1a1a2e;
            --accent: #4caf50;
            --accent-hover: #66bb6a;
            --text-primary: #eee;
            --text-secondary: #888;
            --text-muted: #555;
            --border: #2a2a3e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { max-width: 540px; width: 100%; }
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 14px; }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(76, 175, 80, 0.05);
        }
        .upload-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-text { color: var(--text-secondary); font-size: 14px; }
        .upload-text span { color: var(--accent); font-weight: 600; }

        .file-input { display: none; }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-group label {
            flex: 1;
            padding: 10px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: block;
        }
        .btn-select-file { color: var(--accent); }
        .btn-select-file:hover { background: rgba(76, 175, 80, 0.1); }
        .btn-select-folder { color: #2196f3; }
        .btn-select-folder:hover { background: rgba(33, 150, 243, 0.1); }

        .file-list { margin-bottom: 20px; max-height: 240px; overflow-y: auto; }
        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .file-item-icon {
            width: 32px; height: 32px;
            background: var(--accent);
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            margin-right: 12px;
            font-size: 16px;
            flex-shrink: 0;
        }
        .file-item-info { flex: 1; min-width: 0; }
        .file-item-name {
            font-size: 14px; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .file-item-size { font-size: 12px; color: var(--text-secondary); }
        .file-item-progress {
            height: 3px; background: var(--border);
            border-radius: 2px; overflow: hidden; margin-top: 4px;
        }
        .file-item-progress-fill {
            height: 100%; background: var(--accent);
            width: 0%; transition: width 0.2s;
        }
        .file-item-status { font-size: 11px; color: var(--text-muted); margin-top: 2px; } }
        .file-item-remove {
            width: 24px; height: 24px;
            border: none; background: #e94560; color: #fff;
            border-radius: 50%; cursor: pointer; font-size: 14px;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }
        .file-summary {
            text-align: right;
            padding: 4px 14px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .progress-wrap { margin-bottom: 20px; display: none; }
        .progress-wrap.active { display: block; }
        .progress-bar {
            height: 6px; background: var(--border);
            border-radius: 3px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--accent);
            width: 0%; transition: width 0.3s;
        }
        .progress-info {
            display: flex; justify-content: space-between;
            margin-top: 8px; font-size: 12px; color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .result.active { display: block; }
        .result-icon { font-size: 48px; margin-bottom: 12px; }
        .result-text { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
        .result-link {
            color: var(--accent);
            word-break: break-all;
            font-size: 13px;
        }

        .footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 24px; }

        .resume-hint {
            background: rgba(33, 150, 243, 0.1);
            border: 1px solid rgba(33, 150, 243, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #64b5f6;
            display: none;
        }
        .resume-hint.active { display: block; }

        .btn-retry {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }
        .btn-retry.active { display: block; }
        .btn-retry:hover { background: #ff6b81; }

        .ws-status {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; font-size: 11px; color: var(--text-muted); margin-top: 8px;
        }
        .ws-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #e94560; transition: background 0.3s;
        }
        .ws-dot.connected { background: #4caf50; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="uploadCard">
            <h1>📤 上传文件</h1>
            <p class="subtitle">选择文件上传到局域网分享</p>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p class="upload-text">将文件或文件夹拖拽到此处</p>
            </div>

            <input type="file" id="fileInput" class="file-input" multiple>
            <input type="file" id="folderInput" class="file-input" multiple webkitdirectory directory mozdirectory>

            <div class="btn-group">
                <label for="fileInput" class="btn-select-file">📄 选择文件</label>
                <label for="folderInput" class="btn-select-folder">📁 选择文件夹</label>
            </div>

            <div class="file-list" id="fileList"></div>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-info">
                    <span id="progressText">0%</span>
                    <span id="statusText">上传中...</span>
                </div>
            </div>

            <div class="resume-hint" id="resumeHint"></div>

            <button class="btn" id="uploadBtn" onclick="startUpload()" disabled>
                开始上传
            </button>

            <button class="btn-retry" id="retryBtn" onclick="retryFailed()">
                重试失败文件
            </button>

            <div class="result" id="resultSection">
                <div class="result-icon">✅</div>
                <div class="result-text" id="resultText">上传成功！</div>
                <a class="result-link" id="resultLink" href="#"></a>
            </div>
        </div>
        <p class="footer">由 NetShare 提供 <span class="ws-status" id="wsStatus"><span class="ws-dot" id="wsDot"></span><span id="wsText"></span></span></p>
    </div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
let selectedFiles = []; // { file: File, relativePath: string }

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const folderInput = document.getElementById('folderInput');
const fileListEl = document.getElementById('fileList');
const uploadBtn = document.getElementById('uploadBtn');
const retryBtn = document.getElementById('retryBtn');
const resumeHint = document.getElementById('resumeHint');

// Upload state tracking
let uploadStatus = {};   // relativePath -> 'pending' | 'uploading' | 'done' | 'failed'
let uploadedSize = 0;
let totalUploadSize = 0;
let failedFiles = [];    // array of { file, relativePath }
let uploadSessionId = ''; // Session ID for tracking upload progress
let chunkInfo = {};       // relativePath -> { chunkSize, chunkCount, completedChunks: Set, useChunking }
const MAX_CONCURRENT = 3;

// WebSocket for real-time progress (fallback for mobile browsers)
let ws = null;
let wsConnected = false;
let xhrProgressActive = false; // Track if XHR progress events are firing

// ===== WebSocket Connection =====

function connectWebSocket() {
    const wsPort = location.port ? parseInt(location.port) + 1 : 8081;
    const wsUrl = 'ws://' + location.hostname + ':' + wsPort;

    // If already connected, re-subscribe with the current session ID
    if (ws && ws.readyState === WebSocket.OPEN) {
        if (uploadSessionId) {
            ws.send(JSON.stringify({ type: 'subscribe', data: { token: uploadSessionId } }));
        }
        return;
    }
    // If connecting, let onopen handle subscription
    if (ws && ws.readyState === WebSocket.CONNECTING) return;

    try {
        ws = new WebSocket(wsUrl);
    } catch (e) {
        return;
    }

    ws.onopen = () => {
        wsConnected = true;
        updateWsStatus(true);
        if (uploadSessionId) {
            ws.send(JSON.stringify({ type: 'subscribe', data: { token: uploadSessionId } }));
        }
    };

    ws.onmessage = (e) => {
        try {
            const msg = JSON.parse(e.data);
            if (msg.type === 'transfer_update' && msg.data) {
                handleWsProgress(msg.data);
            }
        } catch (ex) {}
    };

    ws.onclose = () => {
        wsConnected = false;
        updateWsStatus(false);
        // Auto reconnect after 5 seconds if upload is active
        const hasActive = Object.values(uploadStatus).some(s => s === 'uploading' || s === 'pending');
        if (hasActive) {
            setTimeout(connectWebSocket, 5000);
        }
    };

    ws.onerror = () => {};
}

function updateWsStatus(connected) {
    const dot = document.getElementById('wsDot');
    const text = document.getElementById('wsText');
    if (dot) dot.className = 'ws-dot' + (connected ? ' connected' : '');
    if (text) text.textContent = connected ? '实时连接' : '';
}

function handleWsProgress(data) {
    if (data.progress === undefined) return;
    // Only use WS progress if XHR progress is not firing (mobile browser fallback)
    if (xhrProgressActive) return;
    const progressWrap = document.getElementById('progressWrap');
    if (progressWrap) progressWrap.classList.add('active');
    const fill = document.getElementById('progressFill');
    if (fill) fill.style.width = data.progress + '%';
    const pct = document.getElementById('progressText');
    if (pct) pct.textContent = data.progress + '%';
    if (data.speed) {
        const status = document.getElementById('statusText');
        if (status) status.textContent = '上传中... ' + formatSize(data.speed) + '/s';
    }
}

// ===== Drag & Drop with webkitGetAsEntry =====

uploadArea.addEventListener('click', () => {
    fileInput.click();
});

uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));

uploadArea.addEventListener('drop', async (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');

    const items = e.dataTransfer.items;
    if (items && items.length > 0) {
        const entries = [];
        for (let i = 0; i < items.length; i++) {
            const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
            if (entry) entries.push(entry);
        }
        if (entries.length > 0) {
            const files = await traverseEntries(entries, '');
            files.forEach(f => selectedFiles.push(f));
            renderFileList();
            uploadBtn.disabled = selectedFiles.length === 0;
            return;
        }
    }
    handleFiles(e.dataTransfer.files);
});

function traverseEntries(entries, basePath) {
    return new Promise((resolve) => {
        const results = [];
        let pending = entries.length;
        if (pending === 0) { resolve(results); return; }

        for (const entry of entries) {
            if (entry.isFile) {
                entry.file((file) => {
                    const relativePath = basePath ? basePath + '/' + file.name : file.name;
                    results.push({ file: file, relativePath: relativePath });
                    if (--pending === 0) resolve(results);
                }, () => { if (--pending === 0) resolve(results); });
            } else if (entry.isDirectory) {
                readAllDirectoryEntries(entry, basePath).then((subResults) => {
                    results.push(...subResults);
                    if (--pending === 0) resolve(results);
                });
            } else {
                if (--pending === 0) resolve(results);
            }
        }
    });
}

function readAllDirectoryEntries(dirEntry, parentPath) {
    const dirPath = parentPath ? parentPath + '/' + dirEntry.name : dirEntry.name;
    const reader = dirEntry.createReader();

    return new Promise((resolve) => {
        const allEntries = [];
        const readBatch = () => {
            reader.readEntries((batch) => {
                if (batch.length === 0) {
                    if (allEntries.length === 0) { resolve([]); return; }
                    traverseEntries(allEntries, dirPath).then(resolve);
                } else {
                    allEntries.push(...batch);
                    readBatch();
                }
            }, () => resolve([]));
        };
        readBatch();
    });
}

// ===== File input handlers =====

fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files);
    files.forEach(f => selectedFiles.push({ file: f, relativePath: f.name }));
    renderFileList();
    uploadBtn.disabled = selectedFiles.length === 0;
    fileInput.value = '';
});

folderInput.addEventListener('change', () => {
    const files = Array.from(folderInput.files);
    files.forEach(f => {
        const relPath = f.webkitRelativePath || f.name;
        selectedFiles.push({ file: f, relativePath: relPath });
    });
    renderFileList();
    uploadBtn.disabled = selectedFiles.length === 0;
    folderInput.value = '';
});

function handleFiles(files) {
    for (const f of files) {
        selectedFiles.push({ file: f, relativePath: f.name });
    }
    renderFileList();
    uploadBtn.disabled = selectedFiles.length === 0;
}

function renderFileList() {
    fileListEl.innerHTML = '';
    let totalSize = 0;
    selectedFiles.forEach((item, i) => {
        totalSize += item.file.size;
        const div = document.createElement('div');
        div.className = 'file-item';
        div.id = 'file-item-' + i;
        div.innerHTML =
            '<div class="file-item-icon">📄</div>' +
            '<div class="file-item-info">' +
                '<div class="file-item-name" title="' + escapeAttr(item.relativePath) + '">' + escapeHtml(item.relativePath) + '</div>' +
                '<div class="file-item-size">' + formatSize(item.file.size) + '</div>' +
                '<div class="file-item-progress"><div class="file-item-progress-fill" id="file-progress-' + i + '"></div></div>' +
                '<div class="file-item-status" id="file-status-' + i + '"></div>' +
            '</div>' +
            '<button class="file-item-remove" onclick="removeFile(' + i + ')">×</button>';
        fileListEl.appendChild(div);
    });
    if (selectedFiles.length > 0) {
        const summary = document.createElement('div');
        summary.className = 'file-summary';
        summary.textContent = '共 ' + selectedFiles.length + ' 个文件，总大小 ' + formatSize(totalSize);
        fileListEl.appendChild(summary);
    }
}

function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderFileList();
    uploadBtn.disabled = selectedFiles.length === 0;
}

// ===== Resume-capable upload logic =====

async function startUpload() {
    if (selectedFiles.length === 0) return;

    // Calculate totals
    totalUploadSize = 0;
    selectedFiles.forEach(item => totalUploadSize += item.file.size);
    uploadedSize = 0;
    failedFiles = [];
    uploadStatus = {};
    chunkInfo = {};
    xhrProgressActive = false;
    selectedFiles.forEach(item => uploadStatus[item.relativePath] = 'pending');

    // Show progress
    document.getElementById('progressWrap').classList.add('active');
    uploadBtn.disabled = true;
    retryBtn.classList.remove('active');
    resumeHint.classList.remove('active');
    uploadSessionId = '';
    updateProgress(0, selectedFiles.length, 0, totalUploadSize);

    // Step 1: Check which files already exist on server (resume support)
    let filesToUpload = [...selectedFiles];
    try {
        const checkBody = JSON.stringify({
            files: selectedFiles.map(item => ({ path: item.relativePath, size: item.file.size })),
            token: token  // Pass share token for WebSocket routing
        });
        const checkResp = await fetch('/api/upload/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: checkBody
        });
        if (checkResp.ok) {
            const checkData = await checkResp.json();
            // Capture session ID for progress tracking
            if (checkData.sessionId) {
                uploadSessionId = checkData.sessionId;
                // Connect WebSocket for real-time progress (mobile fallback)
                connectWebSocket();
            }

            let skipCount = 0;
            let resumeCount = 0;

            // Handle fully uploaded files
            if (checkData.existing && checkData.existing.length > 0) {
                const existingPaths = new Set(checkData.existing.map(f => f.path));
                const skippedSize = selectedFiles
                    .filter(item => existingPaths.has(item.relativePath))
                    .reduce((sum, item) => sum + item.file.size, 0);

                existingPaths.forEach(path => { uploadStatus[path] = 'done'; });
                uploadedSize += skippedSize;
                filesToUpload = selectedFiles.filter(item => !existingPaths.has(item.relativePath));
                skipCount = existingPaths.size;
            }

            // Handle partially uploaded files (chunked resume)
            if (checkData.partial && checkData.partial.length > 0) {
                checkData.partial.forEach(f => {
                    const useChunking = f.useChunking !== false;
                    if (useChunking && f.chunkSize && f.chunkCount) {
                        // Chunked file: store chunk info
                        chunkInfo[f.path] = {
                            chunkSize: f.chunkSize,
                            chunkCount: f.chunkCount,
                            completedChunks: new Set(f.completedChunks || []),
                            useChunking: true
                        };
                        // Calculate already-uploaded bytes from completed chunks
                        const completedBytes = (f.completedChunks || []).length * f.chunkSize;
                        uploadedSize += completedBytes;
                    } else {
                        // Small file: byte offset resume
                        chunkInfo[f.path] = {
                            resumeOffset: f.size,  // bytes already on disk
                            useChunking: false
                        };
                        uploadedSize += f.size;
                    }
                });
                resumeCount = checkData.partial.length;
            }

            // Show resume hint
            if (skipCount > 0 || resumeCount > 0) {
                let hint = '检测到未完成的上传，';
                const parts = [];
                if (skipCount > 0) parts.push('跳过 ' + skipCount + ' 个已完成文件');
                if (resumeCount > 0) parts.push('续传 ' + resumeCount + ' 个部分文件');
                resumeHint.textContent = hint + parts.join('，');
                resumeHint.classList.add('active');
            }
        }
    } catch (e) {
        // Check failed, just upload all files
    }

    // Step 2: Upload remaining files with concurrency control
    await uploadFilesConcurrent(filesToUpload);

    // Step 3: If all done, finalize
    const doneCount = Object.values(uploadStatus).filter(s => s === 'done').length;
    const failCount = Object.values(uploadStatus).filter(s => s === 'failed').length;

    if (failCount > 0) {
        document.getElementById('statusText').textContent = failCount + ' 个文件上传失败';
        retryBtn.classList.add('active');
        uploadBtn.disabled = true;
    } else if (doneCount === selectedFiles.length) {
        await finalizeUpload();
    }
}

async function uploadFilesConcurrent(files) {
    if (files.length === 0) return;

    let nextIndex = 0;
    const total = selectedFiles.length;

    async function uploadNext() {
        while (nextIndex < files.length) {
            const item = files[nextIndex++];
            uploadStatus[item.relativePath] = 'uploading';

            try {
                await uploadSingleFile(item);
                uploadStatus[item.relativePath] = 'done';
                // Calculate actual new bytes transferred
                const info = chunkInfo[item.relativePath];
                if (info && info.useChunking) {
                    uploadedSize += item.file.size - (info.completedChunks.size * info.chunkSize);
                } else if (info && !info.useChunking && info.resumeOffset) {
                    uploadedSize += item.file.size - info.resumeOffset;
                } else {
                    uploadedSize += item.file.size;
                }
            } catch (e) {
                uploadStatus[item.relativePath] = 'failed';
                failedFiles.push(item);
            }

            const doneCount = Object.values(uploadStatus).filter(s => s === 'done').length;
            updateProgress(doneCount, total, uploadedSize, totalUploadSize);
        }
    }

    // Launch concurrent workers
    const workers = [];
    const concurrency = Math.min(MAX_CONCURRENT, files.length);
    for (let i = 0; i < concurrency; i++) {
        workers.push(uploadNext());
    }
    await Promise.all(workers);
}

function uploadSingleFile(item) {
    const info = chunkInfo[item.relativePath];
    if (info && info.useChunking) {
        return uploadFileChunked(item, info);
    } else {
        return uploadSmallFile(item, info);
    }
}

function uploadFileChunked(item, info) {
    const fileSize = item.file.size;
    const chunkSize = info.chunkSize;
    const totalChunks = Math.ceil(fileSize / chunkSize);

    // Build list of pending chunk indices
    const pendingChunks = [];
    for (let i = 0; i < totalChunks; i++) {
        if (!info.completedChunks.has(i)) {
            pendingChunks.push(i);
        }
    }

    if (pendingChunks.length === 0) {
        return Promise.resolve(); // All chunks already uploaded
    }

    const fileIndex = selectedFiles.indexOf(item);
    let nextChunkIdx = 0;

    async function uploadNextChunk() {
        while (nextChunkIdx < pendingChunks.length) {
            const chunkIndex = pendingChunks[nextChunkIdx++];
            const start = chunkIndex * chunkSize;
            const end = Math.min(start + chunkSize, fileSize);
            const blob = item.file.slice(start, end);

            await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/upload/file', true);
                xhr.setRequestHeader('X-Upload-Session', uploadSessionId);
                xhr.setRequestHeader('X-File-Path', encodeURIComponent(item.relativePath));
                xhr.setRequestHeader('X-Chunk-Index', chunkIndex.toString());

                let gotXhrProgress = false;
                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable && fileIndex >= 0) {
                        if (!gotXhrProgress) {
                            gotXhrProgress = true;
                            xhrProgressActive = true;
                        }
                        // Progress = completed chunks bytes + current chunk loaded
                        const completedBytes = info.completedChunks.size * chunkSize + e.loaded;
                        const percent = Math.min(100, Math.round(completedBytes / fileSize * 100));
                        const fillEl = document.getElementById('file-progress-' + fileIndex);
                        const statusEl = document.getElementById('file-status-' + fileIndex);
                        if (fillEl) fillEl.style.width = percent + '%';
                        if (statusEl) statusEl.textContent = formatSize(completedBytes) + ' / ' + formatSize(fileSize);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        info.completedChunks.add(chunkIndex);
                        // Show 100% for this chunk
                        if (fileIndex >= 0) {
                            const completedBytes = info.completedChunks.size * chunkSize;
                            const percent = Math.min(100, Math.round(completedBytes / fileSize * 100));
                            const fillEl = document.getElementById('file-progress-' + fileIndex);
                            const statusEl = document.getElementById('file-status-' + fileIndex);
                            if (fillEl) fillEl.style.width = percent + '%';
                            if (statusEl && percent >= 100) statusEl.textContent = formatSize(fileSize) + ' / ' + formatSize(fileSize);
                        }
                        resolve();
                    } else {
                        reject(new Error('Chunk upload failed: ' + xhr.status));
                    }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.ontimeout = () => reject(new Error('Timeout'));
                xhr.timeout = 0;

                xhr.send(blob);
            });
        }
    }

    // Use concurrent chunk upload (up to MAX_CONCURRENT chunks in parallel)
    const workers = [];
    const concurrency = Math.min(MAX_CONCURRENT, pendingChunks.length);
    for (let i = 0; i < concurrency; i++) {
        workers.push(uploadNextChunk());
    }
    return Promise.all(workers);
}

function uploadSmallFile(item, info) {
    return new Promise((resolve, reject) => {
        const offset = (info && info.resumeOffset) ? info.resumeOffset : 0;
        const blob = offset > 0 ? item.file.slice(offset) : item.file;
        const formData = new FormData();
        formData.append('file', blob, item.relativePath);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload/file', true);
        if (uploadSessionId) {
            xhr.setRequestHeader('X-Upload-Session', uploadSessionId);
        }
        xhr.setRequestHeader('X-File-Path', encodeURIComponent(item.relativePath));

        // Byte-level progress for the current file
        const fileIndex = selectedFiles.indexOf(item);
        let gotXhrProgress = false;
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable && fileIndex >= 0) {
                if (!gotXhrProgress) {
                    gotXhrProgress = true;
                    xhrProgressActive = true;
                }
                const totalLoaded = offset + e.loaded;
                const percent = Math.round(totalLoaded / item.file.size * 100);
                const fillEl = document.getElementById('file-progress-' + fileIndex);
                const statusEl = document.getElementById('file-status-' + fileIndex);
                if (fillEl) fillEl.style.width = percent + '%';
                if (statusEl) statusEl.textContent = formatSize(totalLoaded) + ' / ' + formatSize(item.file.size);
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                if (fileIndex >= 0) {
                    const fillEl = document.getElementById('file-progress-' + fileIndex);
                    if (fillEl) fillEl.style.width = '100%';
                }
                resolve();
            } else {
                reject(new Error('Upload failed: ' + xhr.status));
            }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.ontimeout = () => reject(new Error('Timeout'));
        xhr.timeout = 0;

        xhr.send(formData);
    });
}

function updateProgress(doneCount, totalCount, doneSize, totalSize) {
    const pct = totalSize > 0 ? Math.round((doneSize / totalSize) * 100) : (totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '% (' + doneCount + '/' + totalCount + ')';
    document.getElementById('statusText').textContent =
        '上传中... ' + formatSize(doneSize) + ' / ' + formatSize(totalSize);
}

async function retryFailed() {
    if (failedFiles.length === 0) return;

    retryBtn.classList.remove('active');
    let itemsToRetry = [...failedFiles];
    failedFiles = [];

    // Re-check for partial files to get fresh session and chunk info
    chunkInfo = {};
    xhrProgressActive = false;
    try {
        const checkBody = JSON.stringify({
            files: itemsToRetry.map(item => ({ path: item.relativePath, size: item.file.size })),
            token: token
        });
        const checkResp = await fetch('/api/upload/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: checkBody
        });
        if (checkResp.ok) {
            const checkData = await checkResp.json();
            if (checkData.sessionId) {
                uploadSessionId = checkData.sessionId;
                connectWebSocket();
            }
            if (checkData.existing && checkData.existing.length > 0) {
                const existingPaths = new Set(checkData.existing.map(f => f.path));
                const skippedSize = itemsToRetry
                    .filter(item => existingPaths.has(item.relativePath))
                    .reduce((sum, item) => sum + item.file.size, 0);
                uploadedSize += skippedSize;
                itemsToRetry = itemsToRetry.filter(item => !existingPaths.has(item.relativePath));
                existingPaths.forEach(path => { uploadStatus[path] = 'done'; });
            }
            if (checkData.partial && checkData.partial.length > 0) {
                checkData.partial.forEach(f => {
                    const useChunking = f.useChunking !== false;
                    if (useChunking && f.chunkSize && f.chunkCount) {
                        chunkInfo[f.path] = {
                            chunkSize: f.chunkSize,
                            chunkCount: f.chunkCount,
                            completedChunks: new Set(f.completedChunks || []),
                            useChunking: true
                        };
                    } else {
                        chunkInfo[f.path] = {
                            resumeOffset: f.size,
                            useChunking: false
                        };
                    }
                });
            }
        }
    } catch (e) {
        // Check failed, just retry without resume
    }

    itemsToRetry.forEach(item => uploadStatus[item.relativePath] = 'pending');
    await uploadFilesConcurrent(itemsToRetry);

    const failCount = Object.values(uploadStatus).filter(s => s === 'failed').length;
    const doneCount = Object.values(uploadStatus).filter(s => s === 'done').length;

    if (failCount > 0) {
        document.getElementById('statusText').textContent = failCount + ' 个文件上传失败';
        retryBtn.classList.add('active');
    } else if (doneCount === selectedFiles.length) {
        await finalizeUpload();
    }
}

async function finalizeUpload() {
    document.getElementById('statusText').textContent = '正在完成...';

    // Determine folder root from the first file's path
    const firstPath = selectedFiles[0].relativePath;
    const isFolder = firstPath.includes('/');
    const folderRoot = isFolder ? firstPath.split('/')[0] : '';

    const finalizeBody = JSON.stringify({
        folder: folderRoot,
        isFolder: isFolder,
        totalSize: totalUploadSize,
        fileCount: selectedFiles.length,
        token: token,
        isReceive: false,
        sessionId: uploadSessionId
    });

    try {
        const resp = await fetch('/api/upload/finalize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: finalizeBody
        });

        if (resp.ok) {
            const data = await resp.json();
            document.getElementById('statusText').textContent = '上传完成!';
            uploadBtn.style.display = 'none';
            retryBtn.classList.remove('active');
            document.getElementById('resultSection').classList.add('active');
            if (data.url) {
                document.getElementById('resultLink').href = data.url;
                document.getElementById('resultLink').textContent = data.url;
            }
        } else {
            document.getElementById('statusText').textContent = '完成操作失败';
            uploadBtn.disabled = false;
        }
    } catch (e) {
        document.getElementById('statusText').textContent = '完成操作失败: 网络错误';
        uploadBtn.disabled = false;
    }
}

function formatSize(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const s = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + s[i];
}

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

function escapeAttr(t) {
    return t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function abortUpload(failedFilesList) {
    if (!uploadSessionId) return;
    const body = JSON.stringify({
        sessionId: uploadSessionId,
        failedFiles: failedFilesList || []
    });
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/upload/abort', new Blob([body], {type: 'application/json'}));
    } else {
        fetch('/api/upload/abort', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: body
        }).catch(() => {});
    }
}

// Do NOT abort on page unload - let partial files remain for resume.
// The user can refresh the page and resume from where they left off.
// Only abort when the user explicitly cancels (not currently implemented as a button,
// but could be added in the future).
